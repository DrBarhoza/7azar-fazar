# This repository is the built site; there is no build step.
[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/trivia-questions.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons keep their filenames when the artwork changes, so revalidate hourly.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Photos and clips are only ever added, never edited in place — cache hard.
[[headers]]
  for = "/landmark-photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/country-shapes/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/reactions/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
